name: Publish Hostinger Static Branch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hostinger-static-publish
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static website
        env:
          NEXT_PUBLIC_SITE_URL: https://shreewinapk.net
          NEXT_PUBLIC_LOGIN_URL: https://shreewin1.com
          NEXT_PUBLIC_REGISTER_URL: https://shreewin1.com
        run: npm run build:static

      - name: Publish generated files to hostinger branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          touch out/.nojekyll
          cd out
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b hostinger
          git add --all
          git commit -m "Static deployment for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:hostinger
